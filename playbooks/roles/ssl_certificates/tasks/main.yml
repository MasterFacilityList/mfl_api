---
- name: remove any existing certificates
  file: 'state=absent name="{{ssl_certificate_dir}}"'
  sudo: yes
  tags: ssl_certificates

- name: make ssl certificates directory
  file: 'state=directory name="{{ssl_certificate_dir}}" mode=0600'
  sudo: yes
  tags: ssl_certificates

- name: copy required certificates and keys
  copy: 'src="{{item.src}}" dest="{{ssl_certificate_dir}}/{{item.dest}}" mode=0600'
  with_items:
    - {src: "{{web_ssl.key.src}}", dest: "{{web_ssl.key.dest}}"}
    - {src: "{{web_ssl.cert.src}}", dest: "{{web_ssl.cert.dest}}"}
  sudo: yes
  tags: ssl_certificates
